<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Coexphal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Paleta tomada del logo */
  :root{
    --turquesa:#009fae;
    --carmesi:#d21146;
    --tinta:#221e20;
    --fondo:#ffffff;
    --blanco:#ffffff;
    --apagado:#4b5d61;
    --linea:#d3e0e2;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#000;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}

  #stage{
    width:688px;height:1032px;flex:none;transform-origin:center center;
    background:var(--fondo);color:var(--tinta);
    font-family:"Poppins","Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;
    font-kerning:normal;
    display:flex;flex-direction:column;position:relative;overflow:hidden;
  }

  /* Cabecera con logo */
  .logo{
    background:var(--blanco);height:130px;flex:none;
    display:flex;align-items:center;justify-content:center;padding:0 48px;
    position:relative;
  }
  .logo svg{width:100%;height:auto;max-height:84px}

  /* Reloj */
  .reloj{background:var(--blanco);color:var(--tinta);text-align:center;padding:26px 0 22px;flex:none;position:relative}
  .logo::after,.reloj::after{content:"";position:absolute;left:48px;right:48px;bottom:0;height:1px;background:var(--linea)}
  .hora{font-size:140px;line-height:1;font-weight:400;letter-spacing:-3px;font-variant-numeric:proportional-nums lining-nums}
  .fecha{margin-top:8px;font-size:26px;color:var(--apagado);text-transform:capitalize}

  /* Clima */
  .clima{flex:none;display:flex;flex-direction:column;padding:20px 48px 16px}
  .ciudad{display:flex;justify-content:space-between;align-items:baseline;font-size:22px;color:var(--apagado)}
  .ciudad b{color:var(--tinta);font-weight:700;font-size:26px}
  .ciudad .mx{color:var(--carmesi);font-weight:600}
  .ciudad .mn{color:var(--turquesa);font-weight:600}
  .actual{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
  .temp{font-size:96px;font-weight:300;line-height:1;letter-spacing:-4px}
  .temp sup{font-size:38px;color:var(--carmesi);font-weight:400;letter-spacing:0;vertical-align:top;position:relative;top:10px}
  .icono{font-size:80px;line-height:1}
  .desc{font-size:24px;margin-top:2px}
  .datos{display:flex;gap:22px;margin-top:6px;font-size:19px;color:var(--apagado)}
  .datos b{color:var(--tinta);font-weight:700}

  .horas{display:flex;justify-content:space-between;margin-top:14px;padding:10px 0;border-top:2px solid var(--linea);border-bottom:2px solid var(--linea)}
  .h{flex:1;text-align:center;font-size:18px;color:var(--apagado)}
  .h .e{font-size:28px;margin:3px 0}
  .h .t{font-size:22px;color:var(--tinta);font-weight:700}

  .dias{display:flex;flex-direction:column;margin-top:4px}
  .d{display:grid;grid-template-columns:150px 50px 1fr auto;align-items:center;gap:10px;padding:6px 0;font-size:21px}
  .d + .d{border-top:1px solid var(--linea)}
  .d .n{text-transform:capitalize}
  .d .e{font-size:26px}
  .d .p{color:var(--turquesa);font-size:18px;font-weight:600}
  .d .m{font-weight:700;color:var(--carmesi)}
  .d .m i{font-style:normal;color:var(--turquesa);font-weight:600;margin-right:10px}

  /* Noticias */
  .noticias{flex:1;min-height:0;position:relative;padding:16px 48px 20px;display:flex;flex-direction:column;overflow:hidden}
  .noticias::before{content:"";position:absolute;left:48px;right:48px;top:0;height:1px;background:var(--linea)}
  .nt-cab{display:flex;justify-content:space-between;align-items:baseline;font-size:18px;color:var(--apagado)}
  .nt-cab b{color:var(--tinta);font-size:22px;font-weight:700}
  .nt-lista{display:flex;flex-direction:column;gap:9px;margin-top:8px;min-height:0}
  .nt{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:start}
  .nt time{font-size:16px;color:var(--turquesa);font-weight:600;padding-top:3px;line-height:1.2}
  .nt span{font-size:19px;line-height:1.25;font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .nt.nueva time{color:var(--carmesi)}
  .nt.nueva span::before{content:"Nueva";display:inline-block;margin-right:8px;padding:0 7px;border-radius:9px;background:var(--carmesi);color:#fff;font-size:13px;font-weight:600;vertical-align:2px}
  .nt-vacio{font-size:18px;color:var(--apagado);margin-top:10px}
  .nt-vacio small{display:block;margin-top:6px;font-size:12px;line-height:1.3;opacity:.8}

  .estado{position:absolute;right:48px;bottom:10px;font-size:14px;color:var(--apagado)}
</style>
</head>

<script>
const LAT = 36.8381, LON = -2.4597;   // Almería
const REFRESCO_MIN = 15;              // actualización del clima (minutos)
const TZ = 'Europe/Madrid';

// Ajuste a la ventana manteniendo 688x1032
function ajustar(){
  const s = Math.min(innerWidth/688, innerHeight/1032);
  document.getElementById('stage').style.transform = `scale(${s})`;
}
addEventListener('resize', ajustar); ajustar();

// Reloj
function reloj(){
  const now = new Date();
  document.getElementById('hm').textContent =
    now.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit',timeZone:TZ});
  document.getElementById('fecha').textContent =
    now.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long',timeZone:TZ});
}
reloj(); setInterval(reloj, 1000);

// Clima (Open-Meteo, sin clave)
const WMO = {
  0:['☀️','Despejado'],1:['🌤️','Mayormente despejado'],2:['⛅','Parcialmente nublado'],3:['☁️','Nublado'],
  45:['🌫️','Niebla'],48:['🌫️','Niebla'],
  51:['🌦️','Llovizna ligera'],53:['🌦️','Llovizna'],55:['🌦️','Llovizna intensa'],
  61:['🌧️','Lluvia ligera'],63:['🌧️','Lluvia'],65:['🌧️','Lluvia fuerte'],
  71:['🌨️','Nieve ligera'],73:['🌨️','Nieve'],75:['🌨️','Nieve fuerte'],
  80:['🌦️','Chubascos'],81:['🌧️','Chubascos fuertes'],82:['⛈️','Chubascos violentos'],
  95:['⛈️','Tormenta'],96:['⛈️','Tormenta con granizo'],99:['⛈️','Tormenta con granizo']
};
const w = c => WMO[c] || ['🌡️','—'];

async function clima(){
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}`
    + `&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,weather_code`
    + `&hourly=temperature_2m,weather_code`
    + `&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max`
    + `&timezone=${encodeURIComponent(TZ)}&forecast_days=4`;
  try{
    const r = await fetch(url); if(!r.ok) throw new Error(r.status);
    const d = await r.json(), c = d.current;
    const [ico, txt] = w(c.weather_code);
    document.getElementById('temp').textContent = Math.round(c.temperature_2m);
    document.getElementById('desc').textContent = txt;
    document.getElementById('icono').textContent = ico;
    document.getElementById('sens').textContent = Math.round(c.apparent_temperature);
    document.getElementById('hum').textContent = Math.round(c.relative_humidity_2m);
    document.getElementById('vie').textContent = Math.round(c.wind_speed_10m);
    document.getElementById('rango').innerHTML =
      `<span class="mn">Mín ${Math.round(d.daily.temperature_2m_min[0])}°</span> · <span class="mx">Máx ${Math.round(d.daily.temperature_2m_max[0])}°</span>`;

    // Próximas 6 franjas (cada 2 h)
    let i = d.hourly.time.findIndex(t => t > c.time); if(i<0) i = 0;
    let h = '';
    for(let k=0;k<6;k++){
      const j = i + k*2; if(j>=d.hourly.time.length) break;
      h += `<div class="h"><div>${d.hourly.time[j].slice(11,16)}</div><div class="e">${w(d.hourly.weather_code[j])[0]}</div><div class="t">${Math.round(d.hourly.temperature_2m[j])}°</div></div>`;
    }
    document.getElementById('horas').innerHTML = h;

    // Próximos 3 días
    let dd = '';
    for(let k=1;k<3;k++){
      const nom = new Date(d.daily.time[k]+'T12:00:00').toLocaleDateString('es-ES',{weekday:'long'});
      dd += `<div class="d"><span class="n">${nom}</span><span class="e">${w(d.daily.weather_code[k])[0]}</span>`
          + `<span class="p">${d.daily.precipitation_probability_max[k] ?? 0}% lluvia</span>`
          + `<span class="m"><i>${Math.round(d.daily.temperature_2m_min[k])}°</i>${Math.round(d.daily.temperature_2m_max[k])}°</span></div>`;
    }
    document.getElementById('dias').innerHTML = dd;
    document.getElementById('estado').textContent = '';
  }catch(e){
    document.getElementById('desc').textContent = 'Sin datos del clima';
    document.getElementById('estado').textContent = 'No se pudo actualizar. Reintentando…';
  }
}
clima(); setInterval(clima, REFRESCO_MIN*60*1000);

/* ====== NOTICIAS ====== */
// noticias.json lo genera y actualiza automáticamente GitHub Actions a partir del feed de aenverde.es
const NOTICIAS_JSON = 'noticias.json';
const NUM_NOTICIAS = 3, REFRESCO_NOTICIAS_MIN = 10;
let vistas = null;

async function noticias(){
  const caja = document.getElementById('noticias');
  let lista;
  try{
    const r = await fetch(NOTICIAS_JSON + '?t=' + Date.now(), {cache:'no-store'});
    if(!r.ok) throw new Error('HTTP ' + r.status);
    lista = (await r.json()).items.map(x => ({id:x.id, titulo:x.titulo, fecha:new Date(x.fecha)}));
  }catch(e){
    if(!caja.querySelector('.nt')) caja.innerHTML = '<div class="nt-vacio">No se han podido cargar las noticias.</div>';
    return;
  }
  if(!lista.length){
    if(!caja.querySelector('.nt')) caja.innerHTML = '<div class="nt-vacio">Todavía no hay noticias.</div>';
    return;
  }
  lista.sort((a,b) => (b.fecha||0) - (a.fecha||0));
  lista = lista.slice(0, NUM_NOTICIAS);
  caja.innerHTML = lista.map(x => {
    const nueva = vistas && !vistas.has(x.id);
    const f = isNaN(x.fecha) ? '' : x.fecha.toLocaleDateString('es-ES',{day:'numeric',month:'short',timeZone:TZ}).replace('.','');
    return `<div class="nt${nueva?' nueva':''}"><time>${f}</time><span></span></div>`;
  }).join('');
  [...caja.querySelectorAll('.nt span')].forEach((el,i) => el.textContent = lista[i].titulo);
  vistas = new Set([...(vistas||[]), ...lista.map(x => x.id)]);
}
noticias(); setInterval(noticias, REFRESCO_NOTICIAS_MIN*60*1000);
</script>
